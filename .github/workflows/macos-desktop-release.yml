name: Heather macOS desktop release

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "services/youtube-auto-editor/**"
      - ".github/workflows/macos-desktop-release.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "services/youtube-auto-editor/**"
      - ".github/workflows/macos-desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DESKTOP_STAGE: /tmp/heather-desktop-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify worker package
        run: python3 services/youtube-auto-editor/install.py --verify-only
      - name: Create isolated desktop build tree
        run: |
          rm -rf "$DESKTOP_STAGE"
          mkdir -p "$DESKTOP_STAGE/apps" "$DESKTOP_STAGE/services"
          cp -R apps/desktop "$DESKTOP_STAGE/apps/desktop"
          cp -R services/youtube-auto-editor "$DESKTOP_STAGE/services/youtube-auto-editor"
      - name: Install desktop dependencies
        working-directory: /tmp/heather-desktop-build/apps/desktop
        run: npm install --no-audit --no-fund
      - name: Validate desktop sources
        working-directory: /tmp/heather-desktop-build/apps/desktop
        run: npm run check
      - name: Build macOS x64 and arm64 packages
        working-directory: /tmp/heather-desktop-build/apps/desktop
        run: npm run dist -- --x64 --arm64
      - name: Collect packages
        run: |
          mkdir -p apps/desktop/dist
          cp "$DESKTOP_STAGE"/apps/desktop/dist/*.dmg apps/desktop/dist/
          cp "$DESKTOP_STAGE"/apps/desktop/dist/*.zip apps/desktop/dist/
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heather-macOS-${{ github.run_number }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Heather-macOS-${{ github.run_number }}
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v0.5.0-${{ github.run_number }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Heather Desktop 0.5.0" \
            --notes "macOS desktop build with managed local video worker. This build is not notarized because no Apple Developer ID certificate is configured." \
            --latest
