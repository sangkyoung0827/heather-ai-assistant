name: Secure bootstrap Heather model to R2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r2-secure-bootstrap.yml"
      - ".r2-bootstrap/credentials-envelope.json"

permissions:
  contents: read

concurrency:
  group: r2-secure-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOOTSTRAP_BRANCH: agent/r2-secure-bootstrap
      ENVELOPE_PATH: .r2-bootstrap/credentials-envelope.json
      MODEL_REPOSITORY: mlc-ai/Qwen2.5-3B-Instruct-q4f16_1-MLC
      MODEL_ID: Heather-Qwen2.5-3B-Instruct-q4f16_1-v1.0.0
      MODEL_VERSION: v1.0.0
      MODEL_PATH: models/qwen2.5-3b-instruct-q4f16_1/v1.0.0
      MODEL_LIB_PATH: libs/webllm-v0_2_84/Qwen2.5-3B-Instruct-q4f16_1_cs1k-webgpu.wasm
      MANIFEST_PATH: manifests/heather-standard-v1.json
      MODEL_LIB_URL: https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/main/web-llm-models/v0_2_84/base/Qwen2.5-3B-Instruct-q4f16_1_cs1k-webgpu.wasm
      MODEL_DIR: .model-dist/model
      MODEL_LIB_FILE: .model-dist/model-lib/Qwen2.5-3B-Instruct-q4f16_1_cs1k-webgpu.wasm
      MANIFEST_FILE: .model-dist/manifests/heather-standard-v1.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect encrypted payload commit
        id: payload
        shell: bash
        run: |
          if [[ -f "${ENVELOPE_PATH}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip duplicate payload-triggered run
        if: steps.payload.outputs.present == 'true'
        run: echo "The original watcher run will consume the encrypted deployment payload."

      - name: Generate ephemeral deployment key
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/r2-bootstrap-private.pem
          openssl pkey -in /tmp/r2-bootstrap-private.pem -pubout -out /tmp/r2-bootstrap-public.pem
          chmod 600 /tmp/r2-bootstrap-private.pem

      - name: Publish encryption public key
        if: steps.payload.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: r2-bootstrap-public-key
          path: /tmp/r2-bootstrap-public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted deployment payload
        if: steps.payload.outputs.present == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${ENVELOPE_PATH}?ref=${BOOTSTRAP_BRANCH}"
          found=0
          for attempt in $(seq 1 180); do
            status=$(curl --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output /tmp/envelope-response.json \
              --write-out '%{http_code}' \
              "${api}")
            if [[ "${status}" == "200" ]]; then
              jq -r '.content' /tmp/envelope-response.json | tr -d '\n' | base64 --decode > /tmp/credentials-envelope.json
              found=1
              break
            fi
            sleep 10
          done
          if [[ "${found}" != "1" ]]; then
            echo "Encrypted deployment payload was not received before timeout." >&2
            exit 1
          fi

      - name: Install deployment tools
        if: steps.payload.outputs.present == 'false'
        run: python -m pip install --disable-pip-version-check cryptography huggingface_hub awscli

      - name: Decrypt and mask R2 credentials
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          envelope = json.loads(Path('/tmp/credentials-envelope.json').read_text(encoding='utf-8'))
          private_key = serialization.load_pem_private_key(
              Path('/tmp/r2-bootstrap-private.pem').read_bytes(),
              password=None,
          )
          aes_key = private_key.decrypt(
              base64.b64decode(envelope['encryptedKey']),
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          plaintext = AESGCM(aes_key).decrypt(
              base64.b64decode(envelope['nonce']),
              base64.b64decode(envelope['ciphertext']),
              b'heather-r2-bootstrap-v1',
          )
          payload = json.loads(plaintext.decode('utf-8'))
          required = ['accountId', 'accessKeyId', 'secretAccessKey', 'bucketName', 'publicBaseUrl']
          missing = [name for name in required if not payload.get(name)]
          if missing:
              raise SystemExit(f"Missing encrypted fields: {', '.join(missing)}")
          Path('/tmp/r2-credentials.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

          account_id=$(jq -r '.accountId' /tmp/r2-credentials.json)
          access_key=$(jq -r '.accessKeyId' /tmp/r2-credentials.json)
          secret_key=$(jq -r '.secretAccessKey' /tmp/r2-credentials.json)
          bucket=$(jq -r '.bucketName' /tmp/r2-credentials.json)
          public_base=$(jq -r '.publicBaseUrl' /tmp/r2-credentials.json)
          echo "::add-mask::${access_key}"
          echo "::add-mask::${secret_key}"
          {
            echo "CLOUDFLARE_ACCOUNT_ID=${account_id}"
            echo "AWS_ACCESS_KEY_ID=${access_key}"
            echo "AWS_SECRET_ACCESS_KEY=${secret_key}"
            echo "AWS_DEFAULT_REGION=auto"
            echo "AWS_EC2_METADATA_DISABLED=true"
            echo "R2_BUCKET_NAME=${bucket}"
            echo "R2_PUBLIC_BASE_URL=${public_base}"
          } >> "${GITHUB_ENV}"
          rm -f /tmp/r2-credentials.json /tmp/credentials-envelope.json

      - name: Download versioned MLC model artifacts
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${MODEL_DIR}" "$(dirname "${MODEL_LIB_FILE}")" "$(dirname "${MANIFEST_FILE}")"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id=os.environ['MODEL_REPOSITORY'],
              revision='main',
              local_dir=os.environ['MODEL_DIR'],
          )
          PY
          rm -rf "${MODEL_DIR}/.cache" "${MODEL_DIR}/.git"

      - name: Download compatible WebGPU model library
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            "${MODEL_LIB_URL}" \
            --output "${MODEL_LIB_FILE}"

      - name: Add model license and redistribution notice
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct/resolve/main/LICENSE" \
            --output "${MODEL_DIR}/LICENSE-QWEN.txt"
          cat > "${MODEL_DIR}/NOTICE" <<'NOTICE'
          Qwen is licensed under the Qwen RESEARCH LICENSE AGREEMENT,
          Copyright (c) Alibaba Cloud. All Rights Reserved.

          This Heather distribution contains an MLC/WebLLM quantized form of
          Qwen2.5-3B-Instruct. Commercial use requires separate permission from
          the model licensor.
          NOTICE

      - name: Build integrity manifest
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-heather-model-manifest.py \
            --model-dir "${MODEL_DIR}" \
            --model-lib "${MODEL_LIB_FILE}" \
            --output "${MANIFEST_FILE}" \
            --model-id "${MODEL_ID}" \
            --version "${MODEL_VERSION}" \
            --model-path "${MODEL_PATH}" \
            --model-lib-path "${MODEL_LIB_PATH}" \
            --source-repository "${MODEL_REPOSITORY}" \
            --source-revision "main" \
            --license-id "qwen-research" \
            --vram-required-mb "2504.76" \
            --context-window-size "4096"

      - name: Upload immutable model artifacts to R2
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "${endpoint}" s3 sync \
            "${MODEL_DIR}/" \
            "s3://${R2_BUCKET_NAME}/${MODEL_PATH}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "${endpoint}" s3 cp \
            "${MODEL_LIB_FILE}" \
            "s3://${R2_BUCKET_NAME}/${MODEL_LIB_PATH}" \
            --content-type "application/wasm" \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url "${endpoint}" s3 cp \
            "${MANIFEST_FILE}" \
            "s3://${R2_BUCKET_NAME}/${MANIFEST_PATH}" \
            --content-type "application/json" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Attempt browser CORS policy
        if: steps.payload.outputs.present == 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          cat > /tmp/r2-cors.json <<'JSON'
          {
            "CORSRules": [
              {
                "AllowedOrigins": ["*"],
                "AllowedMethods": ["GET", "HEAD"],
                "AllowedHeaders": ["*"],
                "ExposeHeaders": ["ETag", "Content-Length", "Content-Range", "Accept-Ranges"],
                "MaxAgeSeconds": 3600
              }
            ]
          }
          JSON
          aws --endpoint-url "${endpoint}" s3api put-bucket-cors \
            --bucket "${R2_BUCKET_NAME}" \
            --cors-configuration file:///tmp/r2-cors.json

      - name: Verify public model endpoints
        if: steps.payload.outputs.present == 'false'
        shell: bash
        run: |
          set -euo pipefail
          public_base="${R2_PUBLIC_BASE_URL%/}"
          curl --fail --location --retry 12 --retry-delay 5 \
            "${public_base}/${MANIFEST_PATH}" \
            --output /tmp/remote-manifest.json
          curl --fail --head --retry 12 --retry-delay 5 \
            "${public_base}/${MODEL_PATH}/mlc-chat-config.json"
          curl --fail --head --retry 12 --retry-delay 5 \
            "${public_base}/${MODEL_LIB_PATH}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('/tmp/remote-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('modelId') != os.environ['MODEL_ID']:
              raise SystemExit('Remote manifest modelId does not match Heather standard model')
          if manifest.get('version') != os.environ['MODEL_VERSION']:
              raise SystemExit('Remote manifest version does not match deployed version')
          print('Heather standard model is publicly reachable from R2.')
          PY
