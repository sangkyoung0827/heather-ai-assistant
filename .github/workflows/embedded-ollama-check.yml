name: Embedded Ollama integration check

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/connect-embedded-ollama.py"
      - "scripts/connect-embedded-ollama-web.py"
      - "scripts/prepare-embedded-ollama.py"
      - "package.json"
      - ".github/workflows/embedded-ollama-check.yml"

concurrency:
  group: embedded-ollama-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply production and embedded-engine patches
        run: npm run prebuild

      - name: Verify embedded patch idempotency
        run: python3 scripts/connect-embedded-ollama.py && python3 scripts/connect-embedded-ollama-web.py

      - name: Install JavaScript dependencies
        run: npm install

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run intent tests
        run: npm run test:intent -w @heather/web

      - name: Build production web application
        run: npm run build -w @heather/web

      - name: Check Tauri Rust bridge
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate embedded runtime preparation script
        run: python3 -m py_compile scripts/prepare-embedded-ollama.py scripts/connect-embedded-ollama.py scripts/connect-embedded-ollama-web.py

  package-and-smoke-test:
    needs: verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm install

      - name: Apply production and embedded-engine patches
        run: npm run prebuild

      - name: Prepare pinned official Ollama runtime
        run: npm run prepare:embedded-ollama

      - name: Verify generated runtime resources
        run: |
          test -x src-tauri/resources/embedded-ollama/ollama
          test -f src-tauri/resources/embedded-ollama/THIRD_PARTY_OLLAMA_LICENSE.txt
          test -f src-tauri/resources/embedded-ollama/embedded-runtime.json
          cat src-tauri/resources/embedded-ollama/embedded-runtime.json
          find src-tauri/resources/embedded-ollama -maxdepth 4 -print | head -100

      - name: Build Heather macOS application
        run: npm run desktop:build

      - name: Locate packaged application
        id: app
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          RUNTIME_PATH="$APP_PATH/Contents/Resources/embedded-ollama/ollama"
          test -x "$RUNTIME_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "runtime_path=$RUNTIME_PATH" >> "$GITHUB_OUTPUT"
          find "$APP_PATH/Contents/Resources/embedded-ollama" -maxdepth 4 -type f | head -100

      - name: Smoke-test packaged runtime and local generation
        env:
          OLLAMA_HOST: 127.0.0.1:11577
          OLLAMA_MODELS: ${{ runner.temp }}/heather-independent-models
          OLLAMA_NOHISTORY: "1"
          OLLAMA_KEEP_ALIVE: "1m"
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          "${{ steps.app.outputs.runtime_path }}" serve >"${RUNNER_TEMP}/heather-embedded-ollama.log" 2>&1 &
          RUNTIME_PID=$!
          cleanup() {
            kill "$RUNTIME_PID" >/dev/null 2>&1 || true
            wait "$RUNTIME_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 80); do
            if curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null; then
              break
            fi
            if ! kill -0 "$RUNTIME_PID" >/dev/null 2>&1; then
              cat "${RUNNER_TEMP}/heather-embedded-ollama.log"
              exit 1
            fi
            sleep 0.25
          done
          curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null

          curl --fail --silent --show-error "http://${OLLAMA_HOST}/api/pull" \
            -H 'Content-Type: application/json' \
            -d '{"model":"smollm:135m","stream":false}' \
            >"${RUNNER_TEMP}/pull.json"

          curl --fail --silent --show-error "http://${OLLAMA_HOST}/api/chat" \
            -H 'Content-Type: application/json' \
            -d '{"model":"smollm:135m","stream":false,"messages":[{"role":"system","content":"Reply with the single word HEATHER_OK."},{"role":"user","content":"Confirm that local generation works."}],"options":{"num_predict":24,"temperature":0}}' \
            >"${RUNNER_TEMP}/chat.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "chat.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          content = str(payload.get("message", {}).get("content", "")).strip()
          if not content:
              raise SystemExit(f"Packaged embedded runtime returned no content: {payload}")
          print(f"Packaged embedded runtime generated: {content}")
          PY

      - name: Archive Heather application
        id: archive
        run: |
          ARCHIVE="${RUNNER_TEMP}/Heather-AI-Assistant-embedded-Ollama-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.app.outputs.app_path }}" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload Heather application
        uses: actions/upload-artifact@v4
        with:
          name: Heather-AI-Assistant-embedded-Ollama-macOS-arm64
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
