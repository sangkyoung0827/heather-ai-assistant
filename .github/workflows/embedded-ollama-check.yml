name: Embedded Ollama integration check

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/connect-embedded-ollama.py"
      - "scripts/connect-embedded-ollama-web.py"
      - "scripts/prepare-embedded-ollama.py"
      - "scripts/smoke-test-packaged-ollama.sh"
      - "package.json"
      - ".github/workflows/embedded-ollama-check.yml"

concurrency:
  group: embedded-ollama-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply production and embedded-engine patches
        run: npm run prebuild

      - name: Verify embedded patch idempotency
        run: python3 scripts/connect-embedded-ollama.py && python3 scripts/connect-embedded-ollama-web.py

      - name: Install JavaScript dependencies
        run: npm install

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Run intent tests
        run: npm run test:intent -w @heather/web

      - name: Build production web application
        run: npm run build -w @heather/web

      - name: Check Tauri Rust bridge
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate embedded runtime preparation scripts
        run: |
          python3 -m py_compile scripts/prepare-embedded-ollama.py scripts/connect-embedded-ollama.py scripts/connect-embedded-ollama-web.py
          bash -n scripts/smoke-test-packaged-ollama.sh

  package-and-smoke-test:
    needs: verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm install

      - name: Apply production and embedded-engine patches
        run: npm run prebuild

      - name: Prepare pinned official Ollama runtime
        run: npm run prepare:embedded-ollama

      - name: Verify generated runtime resources
        run: |
          test -x src-tauri/resources/embedded-ollama/ollama
          test -x src-tauri/resources/embedded-ollama/llama-server
          test -f src-tauri/resources/embedded-ollama/THIRD_PARTY_OLLAMA_LICENSE.txt
          test -f src-tauri/resources/embedded-ollama/embedded-runtime.json
          cat src-tauri/resources/embedded-ollama/embedded-runtime.json
          find src-tauri/resources/embedded-ollama -maxdepth 4 -print | head -100

      - name: Build Heather macOS application
        run: npm run desktop:build

      - name: Locate packaged application
        id: app
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          RUNTIME_PATH="$APP_PATH/Contents/Resources/embedded-ollama/ollama"
          test -x "$RUNTIME_PATH"
          test -x "$APP_PATH/Contents/Resources/embedded-ollama/llama-server"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "runtime_path=$RUNTIME_PATH" >> "$GITHUB_OUTPUT"
          find "$APP_PATH/Contents/Resources/embedded-ollama" -maxdepth 4 -type f | head -100

      - name: Smoke-test packaged runtime and local generation
        run: bash scripts/smoke-test-packaged-ollama.sh "${{ steps.app.outputs.runtime_path }}"

      - name: Archive Heather application
        id: archive
        run: |
          ARCHIVE="${RUNNER_TEMP}/Heather-AI-Assistant-embedded-Ollama-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.app.outputs.app_path }}" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload Heather application
        uses: actions/upload-artifact@v4
        with:
          name: Heather-AI-Assistant-embedded-Ollama-macOS-arm64
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
